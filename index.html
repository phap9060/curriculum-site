<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('portfolio-mode')
          const mode = stored === 'recruiter' ? 'recruiter' : 'dev'
          document.documentElement.classList.toggle('dark', mode === 'dev')
          document.documentElement.dataset.mode = mode
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <meta
      name="description"
      content="Portfólio de Pedro Henrique Assunção Pereira — Desenvolvedor Full Stack com foco em frontend, especialista em React, TypeScript e Node.js, com experiência em produtos de larga escala."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Pedro Henrique — Desenvolvedor Full Stack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
