<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        try {
          // idioma e modo vêm da query string (?lg=pt&mode=dev); padrão: en + recruiter
          const params = new URLSearchParams(location.search)
          const mode = params.get('mode') === 'dev' ? 'dev' : 'recruiter'
          document.documentElement.classList.toggle('dark', mode === 'dev')
          document.documentElement.dataset.mode = mode
        } catch {
          document.documentElement.classList.remove('dark')
        }
        try {
          const isPt = new URLSearchParams(location.search).get('lg') === 'pt'
          document.documentElement.lang = isPt ? 'pt-BR' : 'en'
        } catch {
          /* mantém en */
        }
      })()
    </script>
    <meta
      name="description"
      content="Portfolio of Pedro Henrique Assunção Pereira — Senior Software Engineer working across front end and back end: React, Node.js, distributed systems, messaging, performance and data visualization."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Pedro Henrique — Senior Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
