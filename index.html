<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('portfolio-mode')
          const mode = stored === 'dev' ? 'dev' : 'recruiter'
          document.documentElement.classList.toggle('dark', mode === 'dev')
          document.documentElement.dataset.mode = mode
        } catch {
          document.documentElement.classList.remove('dark')
        }
        try {
          const lang = localStorage.getItem('portfolio-lang')
          const isPt = lang ? lang === 'pt' : navigator.language.toLowerCase().startsWith('pt')
          document.documentElement.lang = isPt ? 'pt-BR' : 'en'
        } catch {
          /* mantém pt-BR */
        }
      })()
    </script>
    <meta
      name="description"
      content="Portfólio de Pedro Henrique Assunção Pereira — Desenvolvedor Front-end Sênior especialista em React e TypeScript, com foco em performance, arquitetura, visualização de dados e automação de testes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Pedro Henrique — Desenvolvedor Front-end Sênior React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
